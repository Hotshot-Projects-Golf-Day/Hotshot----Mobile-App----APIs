name: upd8s
description: "upd8s"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^17.1.0
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^10.0.0
  country_picker: ^2.0.27
  dropdown_button2: ^3.0.0
  video_player: ^2.10.1
  flutter_svg: ^2.2.4
  loading_animation_widget: ^1.3.0
  shimmer: ^3.0.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/image/svg_icons/
    - assets/image/
    - assets/image/svg/
    - assets/videos/splash.mp4
    - assets/image/png/
    - assets/json/

  fonts:
    - family: Aptos
      fonts:
        - asset: assets/fonts/Aptos-Light.ttf
          weight: 300
        - asset: assets/fonts/Aptos-Light-Italic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/Aptos.ttf
          weight: 400
        - asset: assets/fonts/Aptos-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/Aptos-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Aptos-SemiBold-Italic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/Aptos-Bold.ttf
          weight: 700
        - asset: assets/fonts/Aptos-Bold-Italic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/Aptos-Black.ttf
          weight: 900
        - asset: assets/fonts/Aptos-Black-Italic.ttf
          weight: 900
          style: italic